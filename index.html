  .logo { width: 44px; height: 44px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: white; }
  .nama { font-weight: 800; color: var(--brand); }
  .kecil { font-size: 12px; color: var(--muted); }

  .harga { color: var(--primary); font-weight: 800; font-size: 24px; margin: 8px 0; }
  .merah, .tambah, .tombol-ghost { border: 0; background: var(--primary); color: white; height: 44px; border-radius: 999px; padding: 0 18px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .tambah { width: 100%; border-radius: 8px; margin-top: auto; }
  .tombol-ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .foto-banner { width: 100%; max-height: 320px; object-fit: contain; }
  .titik { display: flex; justify-content: center; gap: 0; padding: 4px 0 8px; }
  .titik button { width: 32px; height: 32px; border: 0; background: none; display: grid; place-items: center; }
  .titik button::before { content: ""; width: 12px; height: 12px; border-radius: 99px; background: var(--line); }
  .titik .nyala::before { background: var(--primary); }

  .dua { display: grid; gap: 12px; margin-top: 8px; }

  .kotak { border-radius: 12px; padding: 24px; color: white; }

  .kotak p { margin: 0; }
  .kotak .kecil { color: rgba(255,255,255,.8); }
  .kotak a { font-weight: 700; }
  .biru { background: var(--brand); }
  .merah-kotak { background: var(--primary); }

  .kategori { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  @media (min-width: 700px) { .kategori { grid-template-columns: repeat(6, 1fr); } }
  .kategori button { min-height: 72px; background: white; border: 1px solid var(--line); border-radius: 12px; font-weight: 700; padding: 8px; }
  .kategori .aktif { border: 2px solid var(--primary); color: var(--primary); }

  .etalase { padding: 32px 0 16px; scroll-margin-top: 112px; }
  .etalase h2 { margin: 0 0 4px; }
  .etalase h3.grup { margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .kartu { background: white; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }

  .tanpa-foto a { font-size: 12px; font-weight: 700; color: var(--brand); display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; }

  .isi h3 { margin: 0; font-size: 14px; text-transform: capitalize; overflow-wrap: anywhere; }
  .isi .harga { font-size: 16px; margin: 8px 0 0; }

  .langkah { display: grid; gap: 12px; margin: 24px 0 40px; }
  @media (min-width: 800px) { .langkah { grid-template-columns: 1fr 1fr 1fr; } }
  .langkah article { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .langkah h2 { font-size: 18px; margin: 12px 0 4px; }
  .langkah p { margin: 0; color: var(--muted); }
  .nomor { width: 40px; height: 40px; border-radius: 99px; display: grid; place-items: center; background: var(--primary); color: white; font-weight: 800; }

  .jaminan { background: var(--primary); color: white; }

<div class="layar" id="laci" hidden>

</div>

  { name: "", address: "", kecamatan: "", city: "", pos: "", courier: TOKO.kurir[0], note: "", invoice: false, invoiceName: "" },
  baca("anekamedica-alamat", {})
);

function baca(kunci, awal) {
  try { return JSON.parse(localStorage.getItem(kunci)) || awal; } catch (e) { return awal; }
}
function simpan() {
  try {
    localStorage.setItem("anekamedica-pesanan", JSON.stringify(lines));
    localStorage.setItem("anekamedica-alamat", JSON.stringify(draft));
  } catch (e) { /* penyimpanan browser mati: pesanan tetap jalan, hanya tidak diingat */ }
}

  $("banner").innerHTML = `
    <div>
      <div class="kecil" style="color:var(--brand);font-weight:700">Pilihan etalase</div>

    </div>

  document.querySelectorAll("#titik button").forEach((b, i) => b.classList.toggle("nyala", i === slide));
}
function renderTitik() {
  $("titik").innerHTML = unggulan.map((_, i) =>
    `<button type="button" data-slide="${i}" aria-label="Banner ${i + 1}"></button>`).join("");
}

let timer = null;
let jeda = false;
const kurangGerak = window.matchMedia("(prefers-reduced-motion: reduce)");
function hentiTimer() { clearInterval(timer); timer = null; }
function mulaiTimer() {
  hentiTimer();
  if (kurangGerak.matches || document.hidden || jeda || unggulan.length < 2) return;
  timer = setInterval(() => { slide = (slide + 1) % unggulan.length; renderBanner(); }, 6000);
}
function tahan(nilai) { jeda = nilai; nilai ? hentiTimer() : mulaiTimer(); }
["banner", "titik"].forEach((id) => {
  const el = $(id);
  el.addEventListener("mouseenter", () => tahan(true));
  el.addEventListener("mouseleave", () => { if (!el.contains(document.activeElement)) tahan(false); });
  el.addEventListener("focusin", () => tahan(true));
  el.addEventListener("focusout", () => { if (!el.matches(":hover")) tahan(false); });
});
document.addEventListener("visibilitychange", mulaiTimer);
kurangGerak.addEventListener("change", mulaiTimer);

function renderEtalase() {
  const kata = query.trim().toLowerCase();
  const tampil = products.filter((p) =>
    (category === "Semua" || p.category === category) && (!kata || p.name.toLowerCase().includes(kata)));
  $("hitungan").textContent = tampil.length + " dari " + products.length + " barang.";
  const grup = KATEGORI.filter((n) => n !== "Semua")
    .map((n) => ({
      nama: n,
      /* barang berfoto di depan; urutan asal dijaga dalam tiap kelompok */
      items: [...tampil.filter((p) => p.category === n && p.image), ...tampil.filter((p) => p.category === n && !p.image)]
    }))
    .filter((g) => g.items.length);
  $("daftar").innerHTML = grup.length
    ? grup.map((g) => `<h3 class="grup">${esc(g.nama)}</h3><div class="grid">${g.items.map(kartu).join("")}</div>`).join("")
    : "<p>Tidak ada barang dengan kata itu.</p>";
  renderMenu();
}

/* ---------- keranjang ---------- */
function rinciKeranjang() {
  return lines.map((l) => {
    const barang = products.find((p) => p.id === l.id);
    return barang ? { barang, qty: l.qty } : null;
  }).filter(Boolean);
}
function kekurangan() {
  const k = [];
  if (!WA_OK) k.push("Pemesanan lewat WhatsApp belum dibuka. Silakan beli di Shopee");
  if (!rinciKeranjang().length) k.push("pilih minimal 1 barang");
  if (!draft.name.trim()) k.push("isi nama penerima");
  if (!draft.address.trim()) k.push("isi alamat lengkap");
  if (!draft.kecamatan.trim()) k.push("isi kecamatan");
  if (!draft.city.trim()) k.push("isi kota/kabupaten");
  if (!/^\d{5}$/.test(draft.pos.trim())) k.push("isi kode pos 5 angka");
  if (TOKO.layaniInvoice && draft.invoice && !draft.invoiceName.trim()) k.push("isi nama untuk invoice");
  return k;
}
function renderKeranjang() {
  const rinci = rinciKeranjang();
  const jumlah = rinci.reduce((t, i) => t + i.qty, 0);
  const subtotal = rinci.reduce((t, i) => t + i.barang.price * i.qty, 0);
  $("jumlah").textContent = jumlah;
  $("subtotal").textContent = "Subtotal barang " + rupiah(subtotal) + ". Ongkir belum termasuk.";
  $("isi-keranjang").innerHTML = rinci.length ? rinci.map((i) => `
    <div class="item">
      <p><strong>${esc(i.barang.name)}</strong><br>${rupiah(i.barang.price * i.qty)}</p>
      <div class="baris">
        <button type="button" data-qty="${i.barang.id}" data-ubah="-1" aria-label="Kurangi">−</button>
        <span>${i.qty}</span>
        <button type="button" data-qty="${i.barang.id}" data-ubah="1" aria-label="Tambah">+</button>
      </div>
    </div>`).join("") : '<p class="kecil">Belum ada barang.</p>';
  $("status-kirim").innerHTML = terkirim
    ? `<div class="terkirim">Pesanan <strong>${terkirim}</strong> dibuka di WhatsApp. Kalau sudah terkirim, kosongkan pesanan ini.</div>` : "";
  const kurang = kekurangan();
  $("kirim").disabled = kurang.length > 0;
  $("petunjuk").textContent = !kurang.length ? "" :
    (WA_OK ? "Tombol kirim aktif setelah Anda: " + kurang.join(", ") + "." : kurang[0] + ".");
  $("kosongkan").hidden = !rinci.length;
}
function tambah(id) {
  const ada = lines.find((l) => l.id === id);
  if (ada) ada.qty += 1; else lines.push({ id, qty: 1 });
  terkirim = null;
  simpan();
  renderKeranjang();
}
function ubahQty(id, qty) {
  lines = qty < 1 ? lines.filter((l) => l.id !== id) : lines.map((l) => (l.id === id ? { id, qty } : l));
  terkirim = null;
  simpan();
  renderKeranjang();
}

/* ---------- laci pesanan ---------- */
let pemicu = null;
function bukaLaci() {
  pemicu = document.activeElement;
  $("laci").hidden = false;
  $("halaman").inert = true;
  document.body.classList.add("terkunci");
  $("tutup").focus();
}
function tutupLaci() {
  if ($("laci").hidden) return;
  $("laci").hidden = true;
  $("halaman").inert = false;
  document.body.classList.remove("terkunci");
  if (pemicu && pemicu.focus) pemicu.focus();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") tutupLaci(); });
$("laci").addEventListener("click", (e) => { if (e.target === $("laci")) tutupLaci(); });

/* ---------- kirim ke WhatsApp ---------- */
function kodePesanan() {
  const d = new Date();
  const dua = (n) => String(n).padStart(2, "0");
  return "AM-" + dua(d.getFullYear() % 100) + dua(d.getMonth() + 1) + dua(d.getDate()) + "-" +
    dua(d.getHours()) + dua(d.getMinutes()) + dua(Math.floor(Math.random() * 100));
}
function kirimWhatsApp() {
  if (kekurangan().length) return;
  const rinci = rinciKeranjang();
  const subtotal = rinci.reduce((t, i) => t + i.barang.price * i.qty, 0);
  const kode = kodePesanan();
  const teks = [
    "Halo " + TOKO.nama + ", saya mau pesan.",
    "Kode pesanan: " + kode,
    "",
    ...rinci.map((i, n) => (n + 1) + ". " + i.barang.name + " x" + i.qty + " — " + rupiah(i.barang.price * i.qty)),
    "",
    "Subtotal barang: " + rupiah(subtotal),
    "Ekspedisi: " + draft.courier,
    "Penerima: " + draft.name.trim(),
    "Alamat: " + draft.address.trim() + ", Kec. " + draft.kecamatan.trim() + ", " + draft.city.trim() + " " + draft.pos.trim(),
    TOKO.layaniInvoice && draft.invoice ? "Invoice: ya, atas nama " + draft.invoiceName.trim() : null,
    draft.note.trim() ? "Catatan: " + draft.note.trim() : null,
    "",
    "Mohon info ongkir dan nomor rekening. Setelah transfer, saya kabari di chat ini."
  ].filter((baris) => baris !== null).join("\n");
  window.open(waLink(teks), "_blank", "noopener");
  terkirim = kode;
  renderKeranjang();
}

/* ---------- event ---------- */
document.body.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tambah) tambah(t.dataset.tambah);
  else if (t.dataset.kategori) {
    category = t.dataset.kategori;
    renderEtalase();
    $("etalase").scrollIntoView({ behavior: kurangGerak.matches ? "auto" : "smooth" });
  } else if (t.dataset.slide) { slide = Number(t.dataset.slide); renderBanner(); }
  else if (t.dataset.qty) {
    const baris = lines.find((l) => l.id === t.dataset.qty);
    if (baris) ubahQty(baris.id, baris.qty + Number(t.dataset.ubah));
  } else if (t.id === "buka") bukaLaci();
  else if (t.id === "tutup") tutupLaci();
  else if (t.id === "kirim") kirimWhatsApp();
  else if (t.id === "kosongkan") {
    lines = []; terkirim = null; simpan(); renderKeranjang();
  }
});

const BIDANG = { nama: "name", alamat: "address", kecamatan: "kecamatan", kota: "city", pos: "pos", kurir: "courier", catatan: "note", "nama-invoice": "invoiceName" };
Object.keys(BIDANG).forEach((id) => {
  const el = $(id);
  if (id === "kurir" && !TOKO.kurir.includes(draft.courier)) draft.courier = TOKO.kurir[0];
  el.value = draft[BIDANG[id]];
  el.addEventListener("input", () => {
    draft[BIDANG[id]] = id === "pos" ? (el.value = el.value.replace(/\D/g, "")) : el.value;
    simpan();
    renderKeranjang();
  });
});
$("invoice").checked = !!draft.invoice;
$("label-nama-invoice").hidden = !draft.invoice;
$("invoice").addEventListener("change", (e) => {
  draft.invoice = e.target.checked;
  $("label-nama-invoice").hidden = !draft.invoice;
  simpan();
  renderKeranjang();
});
$("cari").addEventListener("input", (e) => { query = e.target.value; renderEtalase(); });

renderToko();
renderTitik();
renderBanner();
renderEtalase();
renderKeranjang();
mulaiTimer();
</script>
</body>
