<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aneka Medica · Alat kesehatan</title>
<meta name="description" content="Etalase alat kesehatan Aneka Medica: stetoskop, alat ukur, lab dan reagen, alat bantu. Pesanan dikirim ke WhatsApp penjual.">
<link rel="icon" href="/logo.jpg">
<link rel="preload" as="image" href="/catalog/01-littmann-classic-iii.png">
<style>
  :root {
    --bg: #f2f3f5;
    --surface: #ffffff;
    --ink: #1c1c1c;
    --muted: #5e6770;
    --line: #e4e6ea;
    --primary: #d0121a;
    --brand: #163e7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
  }
  body.terkunci { overflow: hidden; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  .ticker { overflow: hidden; background: var(--primary); color: white; }
  .ticker-track { display: flex; width: max-content; padding: 8px 0; animation: geser 40s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker span { font-size: 12px; font-weight: 600; padding: 0 24px; white-space: nowrap; }
  @keyframes geser { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
    html { scroll-behavior: auto; }
  }

  .atas { background: white; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .logo { width: 44px; height: 44px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: white; }
  .nama { font-weight: 800; color: var(--brand); }
  .kecil { font-size: 12px; color: var(--muted); }
  .cari { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; background: var(--bg); }
  @media (max-width: 599px) {
    .bar { flex-wrap: wrap; }
    .bar > div { flex: 1; }
    .cari { order: 3; flex-basis: 100%; }
  }
  .pesanan { height: 44px; border: 0; border-radius: 999px; background: var(--primary); color: white; padding: 0 16px; font-weight: 700; white-space: nowrap; }
  nav { display: flex; gap: 4px; overflow: auto; padding-bottom: 8px; }
  nav button, nav a { background: none; border: 0; height: 44px; padding: 0 12px; color: var(--ink); text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; }
  nav .aktif { font-weight: 800; color: var(--primary); }

  .banner { margin-top: 16px; background: white; border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 16px; padding: 24px; }
  @media (min-width: 800px) { .banner { grid-template-columns: 1fr 1fr; align-items: center; } }
  .banner h1 { margin: 8px 0; font-size: 32px; line-height: 1.15; overflow-wrap: anywhere; }
  .banner h1::first-letter, .isi h3::first-letter, .baris-barang .nm::first-letter { text-transform: uppercase; }
  .harga { color: var(--primary); font-weight: 800; font-size: 24px; margin: 8px 0; }
  .merah, .tambah, .tombol-ghost { border: 0; background: var(--primary); color: white; height: 44px; border-radius: 999px; padding: 0 18px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .tambah { width: 100%; border-radius: 8px; margin-top: auto; }
  .isi .tombol-ghost { width: 100%; border-radius: 8px; margin-bottom: 8px; }
  .tombol-ghost { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .foto-banner { width: 100%; max-height: 320px; object-fit: contain; }
  .titik { display: flex; justify-content: center; gap: 0; padding: 4px 0 8px; }
  .titik button { width: 32px; height: 32px; border: 0; background: none; display: grid; place-items: center; }
  .titik button::before { content: ""; width: 12px; height: 12px; border-radius: 99px; background: var(--line); }
  .titik .nyala::before { background: var(--primary); }

  .dua { display: grid; gap: 12px; margin-top: 8px; }
  @media (min-width: 800px) { .dua { grid-template-columns: 1fr 1fr; } }
  .kotak { border-radius: 12px; padding: 24px; color: white; }
  .kotak h2 { margin: 6px 0 8px; font-size: 20px; line-height: 1.25; }
  .kotak p { margin: 0; }
  .kotak .kecil { color: rgba(255,255,255,.8); }
  .kotak a { font-weight: 700; }
  .biru { background: var(--brand); }
  .merah-kotak { background: var(--primary); }

  .kategori { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  @media (min-width: 700px) { .kategori { grid-template-columns: repeat(6, 1fr); } }
  .kategori button { min-height: 72px; background: white; border: 1px solid var(--line); border-radius: 12px; font-weight: 700; padding: 8px; }
  .kategori .aktif { border: 2px solid var(--primary); color: var(--primary); }

  .etalase { padding: 32px 0 16px; scroll-margin-top: 112px; }
  .daftar-ringkas { scroll-margin-top: 140px; }
  .etalase h2 { margin: 0 0 4px; }
  .etalase h3.grup { margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .kartu { background: white; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .gambar { aspect-ratio: 1; display: grid; place-items: center; padding: 12px; background: white; }
  .gambar img { width: 100%; height: 100%; object-fit: contain; }
  .tanpa-foto { display: grid; place-items: center; gap: 6px; text-align: center; color: var(--muted); }
  .tanpa-foto svg { width: 56px; height: 56px; }
  .tanpa-foto a { font-size: 12px; font-weight: 700; color: var(--brand); display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; }
  .label { background: var(--brand); color: white; font-size: 12px; font-weight: 700; padding: 8px 12px; }
  .isi { padding: 12px; display: flex; flex-direction: column; flex: 1; }
  .isi h3 { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
  .isi .harga { font-size: 16px; margin: 8px 0 0; }

  .langkah { display: grid; gap: 12px; margin: 24px 0 40px; }
  @media (min-width: 800px) { .langkah { grid-template-columns: 1fr 1fr 1fr; } }
  .langkah article { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .langkah h2 { font-size: 18px; margin: 12px 0 4px; }
  .langkah p { margin: 0; color: var(--muted); }
  .nomor { width: 40px; height: 40px; border-radius: 99px; display: grid; place-items: center; background: var(--primary); color: white; font-weight: 800; }

  .jaminan { background: var(--primary); color: white; }
  .jaminan .wrap { display: grid; gap: 8px; padding: 20px 16px; font-weight: 700; font-size: 14px; }
  .jaminan p { margin: 0; }
  @media (min-width: 800px) { .jaminan .wrap { grid-template-columns: repeat(3, 1fr); } }

  .kaki-luar { background: white; border-top: 1px solid var(--line); }
  .kaki { display: grid; gap: 24px; padding: 40px 0 32px; }
  @media (min-width: 800px) { .kaki { grid-template-columns: 1.2fr 1fr 1fr; } }
  .kaki p { margin: 6px 0; }
  .wm { width: 140px; display: block; margin-top: 12px; }

  .wa-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 4; display: flex; align-items: center; gap: 10px; }
  .wa { width: 60px; height: 60px; border-radius: 99px; background: #25d366; color: white; display: grid; place-items: center; text-decoration: none; box-shadow: 0 3px 10px rgba(0,0,0,.25); border: 0; padding: 0; }
  .wa svg { width: 34px; height: 34px; }
  .wa-label { background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; white-space: nowrap; }
  .wa-label strong { font-weight: 700; }
  @media (min-width: 800px) { .wa-label { display: block; } }
  .wa-info { position: absolute; right: 0; bottom: 136px; width: 240px; background: var(--ink); color: white; font-size: 13px; padding: 10px 12px; border-radius: 8px; }

  .layar { position: fixed; inset: 0; background: rgba(28,28,28,.45); display: flex; justify-content: flex-end; z-index: 10; }
  .laci { width: min(440px, 100%); height: 100%; background: var(--bg); display: flex; flex-direction: column; }
  .laci-kepala, .laci-kaki { padding: 12px 16px; background: white; }
  .laci-kepala { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .laci-kaki { border-top: 1px solid var(--line); }
  .laci-kepala button { height: 44px; padding: 0 12px; border: 1px solid var(--line); background: white; border-radius: 8px; }
  .isi-laci { padding: 16px; overflow: auto; flex: 1; }
  .baris { display: flex; gap: 8px; align-items: center; margin: 4px 0 12px; }
  .baris button { width: 44px; height: 44px; border-radius: 99px; border: 1px solid var(--line); background: white; font-size: 18px; }
  .item p { margin: 12px 0 0; overflow-wrap: anywhere; }
  label { display: block; font-size: 14px; font-weight: 700; margin-top: 12px; }
  input, textarea, select { width: 100%; margin-top: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: white; font-weight: 400; min-height: 44px; }
  .dua-kolom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .centang { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .centang input { width: 24px; height: 24px; min-height: 0; margin: 0; flex: none; }
  .catatan-laci { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 12px; font-size: 14px; }
  .petunjuk { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .kosongkan { margin-top: 8px; width: 100%; height: 44px; border: 1px solid var(--line); background: white; border-radius: 999px; font-weight: 700; }
  .terkirim { background: #e9f5ec; border: 1px solid #b6dcc0; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 14px; }
  .kategori button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 104px; }
  .kategori svg { width: 32px; height: 32px; color: var(--brand); }
  .kategori small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .jaminan .butir { display: flex; gap: 12px; align-items: center; }
  .jaminan svg { width: 32px; height: 32px; flex: none; }
  .jaminan strong { display: block; font-size: 16px; }
  .jaminan span { font-weight: 400; }
  @media (min-width: 800px) { .kaki { grid-template-columns: 1.2fr 1fr 1fr 1fr; } }
  .tautan { display: block; background: none; border: 0; padding: 0; min-height: 36px; color: var(--ink); text-align: left; font-size: 14px; }
  .tautan:hover { color: var(--primary); text-decoration: underline; }
  .naik { position: fixed; right: 24px; bottom: 92px; width: 44px; height: 44px; border-radius: 99px; border: 1px solid var(--line); background: white; color: var(--ink); font-size: 18px; z-index: 4; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .iklan { display: grid; gap: 12px; margin-top: 16px; }
  @media (min-width: 800px) { .iklan { grid-template-columns: 1fr 1fr; } }
  .iklan img { width: 100%; display: block; border-radius: 12px; }
  .sorot { display: grid; gap: 12px; margin-top: 24px; }
  @media (min-width: 900px) { .sorot { grid-template-columns: 1fr 2.4fr; } }
  .sorot-panel { border-radius: 12px; padding: 24px; color: white; background: var(--brand); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; }
  .sorot-panel.kedua { background: var(--primary); }
  .sorot-panel svg { width: 56px; height: 56px; }
  .sorot-panel h2 { margin: 0; font-size: 26px; line-height: 1.15; }
  .sorot-panel p { margin: 0; }
  .sorot-panel button { height: 44px; border: 0; border-radius: 999px; padding: 0 18px; font-weight: 700; background: white; color: var(--ink); margin-top: 8px; }
  .berita h2 { margin: 32px 0 12px; }
  .berita-grid { display: grid; gap: 12px; }
  @media (min-width: 800px) { .berita-grid { grid-template-columns: repeat(3, 1fr); } }
  .berita article { background: white; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .berita img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
  .berita .isi-berita { padding: 16px; }
  .berita h3 { margin: 4px 0 8px; font-size: 18px; line-height: 1.25; }
  .berita p { margin: 0 0 8px; color: var(--muted); }
  .berita a { color: var(--primary); font-weight: 700; }
  .pengisi { grid-column: span var(--s2); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; padding: 24px; border-radius: 12px; background: #e6ecf5; border: 1px dashed #b9c6da; }
  .pengisi[data-s2="0"] { display: none; }
  @media (min-width: 700px) {
    .pengisi, .pengisi[data-s2="0"] { grid-column: span var(--s4); display: flex; }
    .pengisi[data-s4="0"] { display: none; }
  }
  .pengisi svg { width: 40px; height: 40px; color: var(--brand); }
  .pengisi h3 { margin: 0; font-size: 18px; color: var(--brand); }
  .pengisi p { margin: 0; color: var(--muted); font-size: 14px; }
  .daftar-ringkas { background: white; border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
  .daftar-ringkas .ket { margin: 0; padding: 12px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .baris-barang .ik { width: 48px; height: 48px; border-radius: 8px; background: #e6ecf5; color: var(--brand); display: grid; place-items: center; }
  .baris-barang .ik svg { width: 26px; height: 26px; }
  .baris-barang { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .baris-barang:last-child { border-bottom: 0; }
  .baris-barang .nm { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .baris-barang .nm a { display: inline-block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--brand); text-transform: none; }
  .baris-barang .hg { color: var(--primary); font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .baris-barang button { height: 40px; min-width: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--primary); color: white; font-weight: 700; }
  @media (max-width: 599px) {
    .baris-barang { grid-template-columns: 48px minmax(0, 1fr) auto; row-gap: 4px; }
    .baris-barang .ik { grid-row: span 2; }
    .baris-barang .nm { grid-column: 2 / -1; }
  }
  @media (max-width: 599px) { .naik { right: auto; left: 16px; bottom: 16px; } }
  .kode { font-size: 12px; font-weight: 400; color: var(--muted); text-transform: none; margin: 2px 0 0; }
  .isi .kode + .harga { margin-top: 6px; }
</style>
</head>
<body>
<div id="halaman">
  <div class="ticker" aria-label="Info toko">
    <div class="ticker-track" id="pita"></div>
  </div>
  <header class="atas">
    <div class="wrap bar">
      <img class="logo" src="/logo.jpg" alt="Logo Aneka Medica" width="44" height="44">
      <div>
        <div class="nama" id="nama-toko">Aneka Medica</div>
        <div class="kecil" id="sub-toko"></div>
      </div>
      <input id="cari" class="cari" type="search" placeholder="Cari stetoskop, Hanna, laringoskop…" aria-label="Cari barang">
      <button class="pesanan" id="buka" type="button">Pesanan <span id="jumlah">0</span></button>
    </div>
    <nav class="wrap" id="menu" aria-label="Kategori"></nav>
  </header>

  <main class="wrap">
    <section class="banner" id="banner" aria-label="Pilihan etalase"></section>
    <div class="titik" id="titik"></div>
    <section class="dua" id="info"></section>
    <section class="iklan" id="iklan" aria-label="Promo" hidden></section>
    <section class="kategori" id="kategori" aria-label="Kategori barang"></section>
    <div id="sorotan"></div>
    <section class="etalase" id="etalase">
      <h2>Etalase alat kesehatan</h2>
      <p class="kecil">Harga dapat berubah sewaktu-waktu. Harga final dikonfirmasi penjual sebelum transfer.</p>
      <p class="kecil" id="hitungan" aria-live="polite"></p>
      <div id="daftar"><p class="kecil">Memuat daftar barang…</p></div>
    </section>
    <section class="berita" id="berita" hidden></section>
    <section class="langkah" id="langkah"></section>
  </main>

  <section class="jaminan">
    <div class="wrap" id="jaminan"></div>
  </section>
  <footer class="kaki-luar">
    <div class="wrap kaki" id="kaki"></div>
  </footer>
  <div class="wa-wrap">
    <span class="wa-label">Butuh bantuan? <strong>Chat kami</strong></span>
    <a class="wa" id="wa" href="#" aria-label="Chat WhatsApp" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M16 3.5A12.5 12.5 0 0 0 5.2 22.3L3.5 28.5l6.4-1.7A12.5 12.5 0 1 0 16 3.5z"/><path fill="currentColor" d="M11.6 9.6c.3-.6.6-.6.9-.6h.7c.2 0 .5 0 .8.6l1.1 2.6c.1.3.1.5-.1.8l-.7.9c-.2.2-.2.5 0 .8.6 1 1.4 1.9 2.4 2.6.6.4 1.1.7 1.6.9.3.1.5.1.7-.1l1-1.2c.2-.3.5-.3.8-.2l2.5 1.2c.3.1.5.3.5.5 0 .9-.3 1.8-1 2.3-.8.6-1.9.9-3 .7-1.7-.4-3.6-1.4-5.2-3-1.5-1.5-2.6-3.2-3-4.7-.4-1.5 0-2.9.9-3.9z"/></svg>
    </a>
    <div class="wa-info" id="wa-info" role="status" hidden>Chat WhatsApp toko segera dibuka. Sementara itu, barang bisa dimasukkan ke pesanan.</div>
  </div>
  <button class="naik" id="naik" type="button" aria-label="Kembali ke atas" hidden>↑</button>
</div>

<div class="layar" id="laci" hidden>
  <aside class="laci" role="dialog" aria-modal="true" aria-labelledby="judul-laci">
    <div class="laci-kepala">
      <strong id="judul-laci">Pesanan</strong>
      <button id="tutup" type="button">Tutup</button>
    </div>
    <div class="isi-laci">
      <div id="status-kirim"></div>
      <div id="isi-keranjang"></div>
      <div id="catatan-laci"></div>
      <label for="nama">Nama penerima<input id="nama" autocomplete="name"></label>
      <label for="alamat">Alamat lengkap<textarea id="alamat" rows="3" autocomplete="street-address"></textarea></label>
      <label for="kecamatan">Kecamatan<input id="kecamatan"></label>
      <div class="dua-kolom">
        <label for="kota">Kota/Kabupaten<input id="kota" autocomplete="address-level2"></label>
        <label for="pos">Kode pos<input id="pos" inputmode="numeric" maxlength="5" autocomplete="postal-code"></label>
      </div>
      <label for="kurir">Ekspedisi
        <select id="kurir"></select>
      </label>
      <div id="blok-invoice" hidden>
        <label class="centang" for="invoice"><input type="checkbox" id="invoice"> Perlu invoice</label>
        <label for="nama-invoice" id="label-nama-invoice" hidden>Nama untuk invoice<input id="nama-invoice"></label>
      </div>
      <label for="catatan">Catatan (opsional)<input id="catatan"></label>
      <p class="kecil" id="subtotal"></p>
    </div>
    <div class="laci-kaki">
      <button class="merah" id="kirim" type="button" style="width:100%">Kirim pesanan ke WhatsApp</button>
      <p class="petunjuk" id="petunjuk" aria-live="polite"></p>
      <button class="kosongkan" id="kosongkan" type="button" hidden>Kosongkan pesanan</button>
    </div>
  </aside>
</div>

<script>
/* ====== TOKO: semua data toko ada di sini. Kosongkan nilai = tidak tampil di halaman. ====== */
const TOKO = {
  nama: "Aneka Medica",
  wa: "",                 // format 62xxxxxxxxxx, tanpa +, spasi, atau 0 di depan
  rating: "",             // angka rating toko, isi hanya kalau sudah pasti
  kota: "Jakarta Utara",
  alamat: "",
  jamBalas: "",           // contoh: "Senin-Sabtu 08.00-17.00"
  izinToko: "",           // nomor izin toko alat kesehatan
  layaniInvoice: false,   // true = tampilkan opsi "Perlu invoice"
  instagram: "",          // link profil Instagram toko (opsional)
  kurir: ["J&T Express", "JNE", "SiCepat", "TIKI", "POS Indonesia"]
};
const WA_OK = /^62[1-9]\d{7,12}$/.test(TOKO.wa);
const KATEGORI = ["Semua", "Stetoskop", "Alat ukur", "Lab & reagen", "Alat bantu", "Lainnya"];

const linkIg = (p) => (/^https:\/\/(www\.)?instagram\.com\//.test(p.ig || "") ? p.ig : "");

/* Daftar barang dibaca dari /produk.csv (kolom: no, nama, harga, kategori, foto, ig, tampil). */
let products = [];
function parseCsv(teks) {
  const baris = []; let sel = "", row = [], q = false;
  for (let i = 0; i < teks.length; i++) {
    const c = teks[i];
    if (q) { if (c === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else q = false; } else sel += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(sel); sel = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && teks[i + 1] === "\n") i++; row.push(sel); sel = ""; baris.push(row); row = []; }
    else sel += c;
  }
  if (sel !== "" || row.length) { row.push(sel); baris.push(row); }
  return baris.filter((r) => r.some((x) => x.trim() !== ""));
}
function bacaProduk(teks) {
  const [kepala, ...isi] = parseCsv(teks.replace(/^\uFEFF/, ""));
  const k = (n) => kepala.map((x) => x.trim().toLowerCase()).indexOf(n);
  const ix = { no: k("no"), nama: k("nama"), harga: k("harga"), kategori: k("kategori"), foto: k("foto"), ig: k("ig"), tampil: k("tampil") };
  const hasil = [], lewat = [];
  isi.forEach((r, n) => {
    const nomor = parseInt(r[ix.no], 10), harga = Number(String(r[ix.harga] || "").replace(/[^\d]/g, ""));
    const nama = (r[ix.nama] || "").trim(), kat = (r[ix.kategori] || "").trim();
    if (!(nomor > 0) || !nama || !(harga > 0) || !KATEGORI.includes(kat) || kat === "Semua") { lewat.push(n + 2); return; }
    if (ix.tampil >= 0 && (r[ix.tampil] || "ya").trim().toLowerCase() === "tidak") return;
    const foto = (r[ix.foto] || "").trim();
    hasil.push({ id: String(nomor).padStart(2, "0"), no: nomor, name: nama, price: harga, category: kat,
      image: foto ? "/catalog/" + foto : "", ig: ix.ig >= 0 ? (r[ix.ig] || "").trim() : "" });
  });
  if (lewat.length) console.warn("produk.csv: baris dilewati (data tidak lengkap atau salah):", lewat.join(", "));
  return hasil;
}
async function muatProduk() {
  const r = await fetch("/produk.csv", { cache: "no-cache" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  products = bacaProduk(await r.text());
  unggulan = products.filter((p) => p.image).slice(0, 5);
}

let timer = null;

const kurangGerak = window.matchMedia("(prefers-reduced-motion: reduce)");
function hentiTimer() { clearInterval(timer); timer = null; }
function mulaiTimer() {
  hentiTimer();
  if (kurangGerak.matches || document.hidden || jeda || unggulan.length < 2) return;
  timer = setInterval(() => { slide = (slide + 1) % unggulan.length; renderBanner(); }, 6000);

  const el = $(id);
  el.addEventListener("mouseenter", () => tahan(true));
  el.addEventListener("mouseleave", () => { if (!el.contains(document.activeElement)) tahan(false); });
  el.addEventListener("focusin", () => tahan(true));
  el.addEventListener("focusout", () => { if (!el.matches(":hover")) tahan(false); });
});

  if (!draft.address.trim()) k.push("isi alamat lengkap");
  if (!draft.kecamatan.trim()) k.push("isi kecamatan");
  if (!draft.city.trim()) k.push("isi kota/kabupaten");
  if (!/^\d{5}$/.test(draft.pos.trim())) k.push("isi kode pos 5 angka");
  if (TOKO.layaniInvoice && draft.invoice && !draft.invoiceName.trim()) k.push("isi nama untuk invoice");
  return k;
}
function renderKeranjang() {
  const rinci = rinciKeranjang();
  const jumlah = rinci.reduce((t, i) => t + i.qty, 0);
  const subtotal = rinci.reduce((t, i) => t + i.barang.price * i.qty, 0);
  $("jumlah").textContent = jumlah;
  $("subtotal").textContent = "Subtotal barang " + rupiah(subtotal) + ". Ongkir belum termasuk.";
  $("isi-keranjang").innerHTML = rinci.length ? rinci.map((i) => `
    <div class="item">
      <p><strong>${esc(i.barang.name)}</strong><br>${rupiah(i.barang.price * i.qty)}</p>
      <div class="baris">
        <button type="button" data-qty="${i.barang.id}" data-ubah="-1" aria-label="Kurangi">−</button>
        <span>${i.qty}</span>
        <button type="button" data-qty="${i.barang.id}" data-ubah="1" aria-label="Tambah">+</button>
      </div>
    </div>`).join("") : '<p class="kecil">Belum ada barang.</p>';
  $("status-kirim").innerHTML = terkirim
    ? `<div class="terkirim">Pesanan <strong>${terkirim}</strong> dibuka di WhatsApp. Kalau sudah terkirim, kosongkan pesanan ini.</div>` : "";
  const kurang = kekurangan();
  $("kirim").disabled = kurang.length > 0;
  $("petunjuk").textContent = !kurang.length ? "" :
    (WA_OK ? "Tombol kirim aktif setelah Anda: " + kurang.join(", ") + "." : kurang[0] + ".");
  $("kosongkan").hidden = !rinci.length;
}
function tambah(id) {
  const ada = lines.find((l) => l.id === id);
  if (ada) ada.qty += 1; else lines.push({ id, qty: 1 });
  terkirim = null;
  simpan();
  renderKeranjang();
}
function ubahQty(id, qty) {
  lines = qty < 1 ? lines.filter((l) => l.id !== id) : lines.map((l) => (l.id === id ? { id, qty } : l));
  terkirim = null;
  simpan();
  renderKeranjang();
}

/* ---------- laci pesanan ---------- */
let pemicu = null;
function bukaLaci() {
  pemicu = document.activeElement;
  $("laci").hidden = false;
  $("halaman").inert = true;
  document.body.classList.add("terkunci");
  $("tutup").focus();
}
function tutupLaci() {
  if ($("laci").hidden) return;
  $("laci").hidden = true;
  $("halaman").inert = false;
  document.body.classList.remove("terkunci");
  if (pemicu && pemicu.focus) pemicu.focus();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") tutupLaci(); });
$("laci").addEventListener("click", (e) => { if (e.target === $("laci")) tutupLaci(); });

/* ---------- kirim ke WhatsApp ---------- */
function kodePesanan() {
  const d = new Date();
  const dua = (n) => String(n).padStart(2, "0");
  return "AM-" + dua(d.getFullYear() % 100) + dua(d.getMonth() + 1) + dua(d.getDate()) + "-" +
    dua(d.getHours()) + dua(d.getMinutes()) + dua(Math.floor(Math.random() * 100));
}
function kirimWhatsApp() {
  if (kekurangan().length) return;
  const rinci = rinciKeranjang();
  const subtotal = rinci.reduce((t, i) => t + i.barang.price * i.qty, 0);
  const kode = kodePesanan();
  const teks = [
    "Halo " + TOKO.nama + ", saya mau pesan.",
    "Kode pesanan: " + kode,
    "",
    ...rinci.map((i, n) => (n + 1) + ". [" + i.barang.no + "] " + i.barang.name + " x" + i.qty + " — " + rupiah(i.barang.price * i.qty)),
    "",
    "Subtotal barang: " + rupiah(subtotal),
    "Ekspedisi: " + draft.courier,
    "Penerima: " + draft.name.trim(),
    "Alamat: " + draft.address.trim() + ", Kec. " + draft.kecamatan.trim() + ", " + draft.city.trim() + " " + draft.pos.trim(),
    TOKO.layaniInvoice && draft.invoice ? "Invoice: ya, atas nama " + draft.invoiceName.trim() : null,
    draft.note.trim() ? "Catatan: " + draft.note.trim() : null,
    "",
    "Mohon info ongkir dan nomor rekening. Setelah transfer, saya kabari di chat ini."
  ].filter((baris) => baris !== null).join("\n");
  window.open(waLink(teks), "_blank", "noopener");
  terkirim = kode;
  renderKeranjang();
}

/* ---------- event ---------- */
document.body.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tambah) tambah(t.dataset.tambah);
  else if (t.dataset.ke) $(t.dataset.ke).scrollIntoView({ behavior: kurangGerak.matches ? "auto" : "smooth", block: "start" });
  else if (t.dataset.cari) { window.scrollTo({ top: 0, behavior: "auto" }); $("cari").focus(); }
  else if (t.dataset.kategori) {
    category = t.dataset.kategori;
    renderEtalase();
    $("etalase").scrollIntoView({ behavior: kurangGerak.matches ? "auto" : "smooth" });
  } else if (t.dataset.slide) { slide = Number(t.dataset.slide); renderBanner(); }
  else if (t.dataset.qty) {
    const baris = lines.find((l) => l.id === t.dataset.qty);
    if (baris) ubahQty(baris.id, baris.qty + Number(t.dataset.ubah));
  } else if (t.id === "buka") bukaLaci();
  else if (t.id === "tutup") tutupLaci();
  else if (t.id === "kirim") kirimWhatsApp();
  else if (t.id === "naik") window.scrollTo({ top: 0, behavior: kurangGerak.matches ? "auto" : "smooth" });
  else if (t.id === "kosongkan") {
    lines = []; terkirim = null; simpan(); renderKeranjang();
  }
});

const BIDANG = { nama: "name", alamat: "address", kecamatan: "kecamatan", kota: "city", pos: "pos", kurir: "courier", catatan: "note", "nama-invoice": "invoiceName" };
Object.keys(BIDANG).forEach((id) => {
  const el = $(id);
  if (id === "kurir" && !TOKO.kurir.includes(draft.courier)) draft.courier = TOKO.kurir[0];
  el.value = draft[BIDANG[id]];
  el.addEventListener("input", () => {
    draft[BIDANG[id]] = id === "pos" ? (el.value = el.value.replace(/\D/g, "")) : el.value;
    simpan();
    renderKeranjang();
  });
});
$("invoice").checked = !!draft.invoice;
$("label-nama-invoice").hidden = !draft.invoice;
$("invoice").addEventListener("change", (e) => {
  draft.invoice = e.target.checked;
  $("label-nama-invoice").hidden = !draft.invoice;
  simpan();
  renderKeranjang();
});
$("cari").addEventListener("input", (e) => { query = e.target.value; renderEtalase(); });

window.addEventListener("scroll", () => { $("naik").hidden = window.scrollY < 600; }, { passive: true });

renderToko();
muatProduk().then(() => {
  renderTambahan();
  renderTitik();
  renderBanner();
  renderEtalase();
  renderKeranjang();
  mulaiTimer();
}).catch((e) => {
  console.error("produk.csv gagal dimuat:", e);
  $("banner").hidden = true;
  $("daftar").innerHTML = '<p>Daftar barang belum bisa dimuat. Muat ulang halaman, atau hubungi penjual.</p>';
});
</script>
</body>
</html>
